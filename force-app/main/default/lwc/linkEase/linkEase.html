<template>
    <div class="link-ease-shell">
        <textarea class="clipboard-fallback" aria-hidden="true" tabindex="-1"></textarea>
        <header class="page-header">
            <div class="header-title"><span class="linkease-icon" aria-hidden="true"><lightning-icon icon-name="utility:link" size="small"></lightning-icon></span><div><h1>LinkEase</h1><span class="sync-pill"><span class="sync-dot"></span>Synced</span></div></div>
            <div class="header-actions"><span class="sharepoint-connected" title="SharePoint connected"><span class="sharepoint-logo" aria-hidden="true">S</span><span>Connected</span></span><button class="open-sharepoint-button" type="button" onclick={openInSharePoint} title="Open selected file or current folder in SharePoint"><lightning-icon icon-name="utility:open" size="x-small"></lightning-icon><span>Open in SharePoint</span></button></div>
        </header>
        <nav class="breadcrumb" aria-label="SharePoint folder path">
            <template for:each={breadcrumbs} for:item="crumb" for:index="index">
                <span key={crumb.id} class="breadcrumb-item">
                    <template if:true={crumb.isCurrent}><span class="breadcrumb-current">{crumb.name}</span></template>
                    <template if:false={crumb.isCurrent}><button class="breadcrumb-link" type="button" data-id={crumb.id} data-index={index} onclick={handleBreadcrumbClick}>{crumb.name}</button></template>
                    <template if:false={crumb.isLast}><span class="breadcrumb-sep" aria-hidden="true">&rsaquo;</span></template>
                </span>
            </template>
        </nav>

        <lightning-card class="files-card">
            <div class="link-ease-panel">
                <section class="summary-grid" aria-label="Current folder summary"><article class="summary-card"><span>Files</span><strong>{currentFileCount}</strong><small>in this SharePoint folder</small></article><article class="summary-card"><span>Storage used</span><strong>{currentFolderSizeLabel}</strong><small>files currently visible</small></article><article class="summary-card"><span>Location</span><strong>SharePoint</strong><small>{currentFolderLabel}</small></article></section>

                <template if:true={showUploadModal}>
                    <section class="upload-modal-backdrop" role="presentation" onclick={handleModalBackdropClick}>
                        <div class="upload-modal" role="dialog" aria-modal="true" aria-labelledby="upload-modal-title" onclick={stopModalPropagation}>
                            <div class="modal-header" id="upload-modal-title">Upload Files</div>
                            <div class="modal-body">
                                <template if:true={hasFiles}>
                                    <ul class="upload-progress-list" aria-label="Upload progress">
                                        <template for:each={modalFiles} for:item="file">
                                            <li key={file.id}>
                                                <lightning-icon icon-name="utility:file" size="small"></lightning-icon>
                                                <div class="upload-file-details"><span>{file.name}</span><small>{file.sizeLabel}</small></div>
                                                <div class="progress-track"><span class="progress-fill" style={file.progressStyle}></span></div>
                                                <span class="progress-value">{file.progress}%</span>
                                                <template if:true={file.isComplete}><lightning-icon class="upload-check" icon-name="utility:success" size="small"></lightning-icon></template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template if:false={hasFiles}>
                                    <div class="modal-drop-zone" ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                                        <input class="modal-file-input" type="file" multiple disabled={isUploading} onchange={handleFileChange} aria-label="Select files to upload" />
                                        <span class="modal-select-label"><lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon> Select Files</span><p>or drop files here</p>
                                    </div>
                                </template>
                            </div>
                            <div class="modal-footer">
                                <template if:true={uploadComplete}><lightning-button label="Done" onclick={finishUpload}></lightning-button></template>
                                <template if:false={uploadComplete}><lightning-button label="Cancel" onclick={closeUploadModal} disabled={isUploading}></lightning-button></template>
                            </div>
                        </div>
                    </section>
                </template>

                <template if:true={isUploading}><lightning-spinner alternative-text="Uploading files to SharePoint" size="small"></lightning-spinner><p class="slds-text-body_small slds-m-top_small">{uploadStatus}</p></template>

                <template if:true={canUploadToCurrentFolder}>
                    <section class="upload-panel upload-canvas" aria-label="Upload files" ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                        <lightning-input class="hidden-file-input" type="file" label="Upload files" variant="label-hidden" multiple disabled={isUploading} onchange={handleFileChange}></lightning-input>
                        <div class="upload-canvas-prompt"><lightning-icon icon-name="utility:upload" size="small"></lightning-icon><strong>Drag files here, or browse</strong><span>Maximum file size: 50 MB</span><lightning-button label="Browse files" variant="brand" onclick={focusFileInput} disabled={isUploading}></lightning-button></div>
                        <template if:true={hasFiles}>
                            <ul class="selected-files" aria-label="Selected files"><template for:each={files} for:item="file"><li key={file.name}><span class="selected-file-name">{file.name}</span><span class="selected-file-size">{file.sizeLabel}</span></li></template></ul>
                            <div class="upload-action compact-upload-action"><lightning-button variant="brand" label="Upload to SharePoint" onclick={handleUpload} disabled={uploadDisabled}></lightning-button></div>
                        </template>
                    </section>
                </template>
                <template if:false={canUploadToCurrentFolder}>
                    <div class="upload-restricted" role="status">This folder is view-only from the Account record. Return to the Account folder to upload files.</div>
                </template>

                <div class="library-section">
                    <template if:true={libraryErrorMessage}><div class="error-banner" role="alert"><lightning-icon icon-name="utility:error" size="x-small"></lightning-icon><span>{libraryErrorMessage}</span><button type="button" onclick={handleRefresh}>Retry</button></div></template>
                    <div class="library-viewbar">
                        <div class="search-box"><lightning-icon icon-name="utility:search" size="x-small"></lightning-icon><input type="search" placeholder="Search all files..." value={searchTerm} oninput={handleSearch} aria-label="Search files" /></div>
                        <div class="filter-group" role="group" aria-label="File filters"><template for:each={filterOptions} for:item="filter"><button key={filter.key} class={filter.className} type="button" data-filter={filter.key} onclick={handleFilter}>{filter.label}</button></template></div>
                        <div class="view-toggle" role="group" aria-label="Library view"><button class="icon-button" type="button" onclick={setListView} aria-label="List view"><lightning-icon icon-name="utility:list" size="xx-small"></lightning-icon></button><button class="icon-button" type="button" onclick={setGridView} aria-label="Grid view"><lightning-icon icon-name="utility:apps" size="xx-small"></lightning-icon></button></div>
                    </div>
                    <template if:true={showBulkActions}><div class="bulk-bar" role="toolbar" aria-label="Selected file actions"><span>{selectedCount} selected</span><template if:true={showBulkDownload}><button type="button" onclick={downloadSelectedFile}>Download</button></template><button type="button" onclick={copyLink}>Copy link</button><button type="button" onclick={deleteSelectedFiles}>Delete</button></div></template>
                    <template if:true={isPreparingFolders}><div class="folder-preparing" role="status"><lightning-icon icon-name="utility:sync" size="x-small"></lightning-icon><span>{folderPreparationMessage}</span></div></template>
                    <template if:true={isLoadingFiles}><lightning-spinner alternative-text="Loading SharePoint files" size="small"></lightning-spinner></template>
                    <template if:true={hasLibraryRows}>
                    <template if:true={isListView}>
                        <div class="table-wrap">
                            <table class="library-table" style={tableStyle}>
                                <colgroup><template for:each={columnStyles} for:item="column"><col key={column.index} style={column.style}></col></template></colgroup>
                                <thead><tr>
                                    <th scope="col"><span class="column-heading"><input type="checkbox" checked={allFilesSelected} onchange={handleSelectAllFiles} aria-label="Select all files" /><lightning-icon icon-name="utility:file" size="xx-small"></lightning-icon>Name</span><button class="column-resizer" type="button" data-index="0" onmousedown={handleResizeStart} aria-label="Resize Name column" title="Drag to resize Name column"></button></th>
                                    <th scope="col"><span class="column-heading">File Type</span><button class="column-resizer" type="button" data-index="1" onmousedown={handleResizeStart} aria-label="Resize File Type column" title="Drag to resize File Type column"></button></th>
                                    <th scope="col"><span class="column-heading">Modified</span><button class="column-resizer" type="button" data-index="2" onmousedown={handleResizeStart} aria-label="Resize Modified column" title="Drag to resize Modified column"></button></th>
                                    <th scope="col"><span class="column-heading">Created By</span></th>
                                    <th scope="col"><span class="column-heading">Size</span></th>
                                </tr></thead>
                                <tbody>
                                    <template for:each={libraryRows} for:item="item">
                                        <tr key={item.id} class={item.rowClass} data-id={item.id} data-name={item.name} data-url={item.webUrl} data-folder={item.isFolder} onclick={handleRowSelect}>
                                            <td><div class="name-cell"><input class="row-selector" type="checkbox" checked={item.isSelected} data-id={item.id} data-name={item.name} data-url={item.webUrl} data-folder={item.isFolder} onchange={handleSelectionChange} onclick={stopRowSelection} aria-label={item.name} /><template if:true={item.isFolder}><span class="folder-icon" aria-hidden="true"></span><button class="name-link" type="button" data-id={item.id} data-name={item.name} onclick={handleFolderOpen}>{item.name}</button></template><template if:false={item.isFolder}><span class={item.fileIconClass} aria-hidden="true"></span><template if:true={item.webUrl}><a class="name-link" href={item.webUrl} target="_blank" rel="noopener">{item.name}</a></template><template if:false={item.webUrl}><span class="name-text">{item.name}</span></template></template></div></td>
                                            <td class="file-type-cell">{item.fileType}</td>
                                            <td class="meta-cell">{item.modifiedLabel}</td>
                                            <td><template if:true={item.lastModifiedBy}><span class="modified-by">{item.lastModifiedBy}</span></template></td>
                                            <td class="meta-cell">{item.sizeLabel}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:true={isGridView}><div class="file-grid"><template for:each={libraryRows} for:item="item"><article key={item.id} class="file-tile" data-id={item.id} data-name={item.name} data-url={item.webUrl} data-folder={item.isFolder} onclick={handleRowSelect}><span class={item.fileIconClass} aria-hidden="true"></span><strong>{item.name}</strong><small>{item.modifiedLabel} · {item.sizeLabel}</small><template if:true={item.isFolder}><button type="button" data-id={item.id} data-name={item.name} onclick={handleFolderOpen}>Open folder</button></template></article></template></div></template>
                    </template>
                    <template if:true={showNoFilesMessage}><div class="empty-state"><lightning-icon icon-name="utility:folder" size="medium"></lightning-icon><strong>This folder is empty</strong><span>Upload a file to get started.</span></div></template>
                </div>
            </div>
        </lightning-card>
    </div>
</template>
