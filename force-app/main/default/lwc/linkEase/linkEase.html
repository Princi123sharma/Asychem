<template>
    <lightning-card title="LinkEase" icon-name="utility:share_file">
        <div class="link-ease-panel slds-p-horizontal_small slds-p-bottom_small">
            <section class="upload-panel" aria-label="Upload files">
                <div class="file-header">
                    <div class="file-heading">
                        <lightning-icon icon-name="utility:attach" size="x-small"></lightning-icon>
                        <span>Files ({files.length})</span>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:down"
                        alternative-text="File actions"
                        title="File actions"
                        variant="bare">
                    </lightning-button-icon>
                </div>

                <div class="drop-zone">
                    <lightning-input
                        type="file"
                        label="Upload files"
                        variant="label-hidden"
                        multiple
                        disabled={isUploading}
                        onchange={handleFileChange}>
                    </lightning-input>
                    <p class="drop-hint">Or drop files</p>
                    <p class="size-hint">Maximum 2 MB per file</p>
                </div>

                <template if:true={hasFiles}>
                    <ul class="selected-files" aria-label="Selected files">
                        <template for:each={files} for:item="file">
                            <li key={file.name}>
                                <span class="selected-file-name">{file.name}</span>
                                <span class="selected-file-size">{file.sizeLabel}</span>
                            </li>
                        </template>
                    </ul>
                </template>

                <div class="upload-action">
                    <lightning-button variant="brand" label="Upload to SharePoint"
                        onclick={handleUpload} disabled={uploadDisabled}>
                    </lightning-button>
                </div>
            </section>

            <template if:true={isUploading}>
                <lightning-spinner alternative-text="Uploading files to SharePoint" size="small"></lightning-spinner>
                <p class="slds-text-body_small slds-m-top_small">{uploadStatus}</p>
            </template>

            <div class="library-section slds-m-top_medium">
                <div class="library-toolbar">
                    <nav class="breadcrumb" aria-label="SharePoint folder path">
                        <template for:each={breadcrumbs} for:item="crumb" for:index="index">
                            <span key={crumb.id} class="breadcrumb-item">
                                <template if:true={crumb.isCurrent}>
                                    <span class="breadcrumb-current">{crumb.name}</span>
                                </template>
                                <template if:false={crumb.isCurrent}>
                                    <button class="breadcrumb-link" type="button"
                                        data-id={crumb.id} data-index={index}
                                        onclick={handleBreadcrumbClick}>{crumb.name}</button>
                                </template>
                                <template if:false={crumb.isLast}>
                                    <span class="breadcrumb-sep" aria-hidden="true">›</span>
                                </template>
                            </span>
                        </template>
                    </nav>
                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh files"
                        title="Refresh files" onclick={handleRefresh} disabled={isLoadingFiles}>
                    </lightning-button-icon>
                </div>

                <div class="view-chip">All Documents</div>

                <template if:true={isLoadingFiles}>
                    <lightning-spinner alternative-text="Loading SharePoint files" size="small"></lightning-spinner>
                </template>

                <template if:true={hasLibraryRows}>
                    <table class="library-table">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Modified</th>
                                <th scope="col">Modified By</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={libraryRows} for:item="item">
                                <tr key={item.id}>
                                    <td>
                                        <div class="name-cell">
                                            <template if:true={item.isFolder}>
                                                <span class="folder-icon" aria-hidden="true"></span>
                                                <button class="name-link" type="button"
                                                    data-id={item.id} data-name={item.name}
                                                    onclick={handleFolderOpen}>{item.name}</button>
                                            </template>
                                            <template if:false={item.isFolder}>
                                                <span class="file-icon" aria-hidden="true"></span>
                                                <template if:true={item.webUrl}>
                                                    <a class="name-link" href={item.webUrl} target="_blank" rel="noopener">{item.name}</a>
                                                </template>
                                                <template if:false={item.webUrl}>
                                                    <span class="name-text">{item.name}</span>
                                                </template>
                                            </template>
                                        </div>
                                    </td>
                                    <td class="meta-cell">{item.modifiedLabel}</td>
                                    <td>
                                        <template if:true={item.lastModifiedBy}>
                                            <span class="modified-by">{item.lastModifiedBy}</span>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:true={showNoFilesMessage}>
                    <p class="slds-text-body_small slds-text-color_weak slds-p-vertical_small">
                        No files are currently in this SharePoint folder.
                    </p>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
